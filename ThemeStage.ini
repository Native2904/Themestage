[ThemMgr]

; Which theme is currently active. Empty = the plugin does not touch
; TC's colors at all (opt-in). Set automatically when you pick a theme
; in the panel - nothing to enter here by hand.
ActiveTheme=

; 1 = file-type colors are regenerated automatically on every theme
;     change (matching the chosen theme).
; 0 = your own, manually set file-type colors in TC are kept per theme
;     and restored when you switch back to that theme.
AutoColorFilters=1

; 1 = a theme change fully restarts TC (older, guaranteed-to-work
;     path - brief window flash).
; 0 = default as of this version. Theme changes take effect
;     immediately, no restart - see ColorFilterReloadMethod= below for
;     details. Requires TC 10.50 or newer. Set this to 1 on older TC.
; Only affects normal theme changes - "! Reset" always restarts TC
; (it removes a color redirect, which needs a real restart regardless
; of this setting).
AutoRestartForTitle=0

; Only relevant when AutoRestartForTitle=0 (see above).
; 0 = older darkmode-bounce (briefly toggles TC's dark mode off/on to
;     force a color reload).
; 1 = default. TC's own cm_SwitchColorsByFileType command (2957) -
;     purpose-built, refreshes both base panel colors AND file-type
;     color filters live, tested repeatedly (theme changes,
;     AutoColorFilters=0 and =1, no visible flicker in either case).
;     Requires TC 10.50 or newer, same as AutoRestartForTitle=0 above.
ColorFilterReloadMethod=1

; Logging - default is now ON (was 0). The single most critical
; moment (first launch, first contact with a possibly pre-existing
; color redirect) used to go unlogged by default, which made
; diagnosing a real data-loss case unnecessarily hard. Can go back to
; 0 after a few versions without further incidents.
DebugLogging=1
