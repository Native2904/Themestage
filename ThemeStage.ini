[ThemMgr]

; Welches Theme aktiv ist. Leer = Plugin greift nicht in TCs Farben
; ein (Opt-in). Wird beim Auswaehlen eines Themes im Panel automatisch
; gesetzt - hier muss nichts von Hand eingetragen werden.
ActiveTheme=

; 1 = Dateityp-Farben werden bei jedem Themewechsel automatisch neu
;     generiert (passend zum jeweiligen Theme).
; 0 = eigene, manuell in TC gesetzte Dateityp-Farben bleiben pro
;     Theme gespeichert und werden beim Zurueckwechseln wiederhergestellt.
AutoColorFilters=1

; Aktueller Stand: Themewechsel = kompletter TC-Neustart. Das ist
; der einzige Weg, der zuverlaessig sowohl Farben als auch den
; Fenstertitel sofort korrekt zeigt. Sollte es kuenftig einen Weg
; ohne Neustart geben, wird das hier nachgeruestet - bis dahin bleibt
; dieser Schalter auf 1.
AutoRestartForTitle=1

; Protokollierung - fuer den normalen Gebrauch aus, spart unnoetig
; wachsende Logdateien.
DebugLogging=0

####English section – for translation purposes only####
;[ThemMgr]
;
; Specifies the active theme. Empty = Plugin does not interfere with TC's colors
; (opt-in). Set automatically when a theme is selected in the panel—
; no manual entry required here.
;ActiveTheme=
;
; 1 = File type colors are automatically regenerated whenever the theme
; changes (matching the specific theme).
; 0 = Custom file type colors set manually in TC are saved per
; theme and restored when switching back.
;AutoColorFilters=1
;
; Current status: Theme change = complete TC restart. This is
; the only reliable way to immediately display both the colors
; and the window title correctly. If a method without restarting
; becomes available in the future, this will be updated—until then,
; this setting remains at 1.
;AutoRestartForTitle=1
;
; Logging – disabled for normal use to prevent log files
; from growing unnecessarily large.
;DebugLogging=0
