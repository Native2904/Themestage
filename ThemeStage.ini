[ThemMgr]

; Welches Theme aktiv ist. Leer = Plugin greift nicht in TCs Farben
; ein (Opt-in). Wird beim Auswaehlen eines Themes im Panel automatisch
; gesetzt - hier muss nichts von Hand eingetragen werden.
ActiveTheme=

; 1 = Dateityp-Farben werden bei jedem Themewechsel automatisch neu
;     generiert (passend zum jeweiligen Theme).
; 0 = eigene, manuell in TC gesetzte Dateityp-Farben bleiben pro
;     Theme gespeichert und werden beim Zurueckwechseln wiederhergestellt.
AutoColorFilters=1

; 1 = Themewechsel startet TC komplett neu (alter, garantiert
;     funktionierender Weg - kurzes Aufblitzen des Fensters).
; 0 = Standard ab dieser Version. Themewechsel wirken sofort, ohne
;     Neustart - siehe ColorFilterReloadMethod= unten fuer die Details.
;     Braucht TC 10.50 oder neuer. Bei aelterem TC hier auf 1 stellen.
; Betrifft NUR normale Themewechsel - "! Reset" startet TC in JEDEM
; Fall neu (entfernt eine Farbumleitung, das braucht immer einen
; echten Neustart, unabhaengig von dieser Einstellung).
AutoRestartForTitle=0

; NUR relevant, wenn AutoRestartForTitle=0 (siehe oben).
; 0 = alter Darkmode-Bounce (TCs Dunkelmodus kurz aus/an schalten,
;     um Farben neu einzulesen).
; 1 = Standard. TCs eigener Befehl cm_SwitchColorsByFileType (2957) -
;     zweckgebunden, aktualisiert Basis-Panelfarben UND Dateityp-
;     Farbfilter live, mehrfach getestet (Themewechsel, AutoColorFilters=0
;     und =1, jeweils ohne sichtbares Flackern). Braucht TC 10.50 oder
;     neuer, genau wie AutoRestartForTitle=0 oben.
ColorFilterReloadMethod=1

; Protokollierung - fuer den normalen Gebrauch aus, spart unnoetig
; wachsende Logdateien.
DebugLogging=0
